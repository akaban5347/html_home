<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>Регистрация</h1>
      <p>Уже есть аккаунт?</p>
      <a href="#">Войти</a>
      <form action="#" method="post">
        <input
          type="text"
          id="username"
          name="username"
          placeholder="Введите ваш логин"
        />
        <input type="text" id="name" placeholder="Имя" name="name" />
        <input type="text" id="surname" placeholder="Фамилия" name="surname" />
        <input type="email" id="email" placeholder="E-mail" name="email" />
        <label
          ><input type="checkbox" name="agree" required /> Я прочитал и принимаю
          <a id="bottom-a" href="#">Условия использования</a></label
        >
        <button type="submit">Зарегистрироваться</button>
      </form>
    </main>
  </body>
</html>
